<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" data-dynamic-theme-color="true" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const THEME_BACKGROUNDS = {
          default: { light: "#ffffff", dark: "#161616" },
          github: { light: "#ffffff", dark: "#0d1117" },
          catppuccin: { light: "#eff1f5", dark: "#1e1e2e" },
          tokyonight: { light: "#e1e2e7", dark: "#1a1b26" },
          gruvbox: { light: "#fbf1c7", dark: "#282828" },
          nord: { light: "#eceff4", dark: "#2e3440" },
          dracula: { light: "#fffbeb", dark: "#282a36" },
          material: { light: "#fafafa", dark: "#121212" },
          everforest: { light: "#fdf6e3", dark: "#2d353b" },
          nightowl: { light: "#fbfbfb", dark: "#011627" },
          rosepine: { light: "#faf4ed", dark: "#191724" },
        };
        const applyChromeColor = (color) => {
          document.documentElement.style.backgroundColor = color;
          // Browsers use the first matching theme-color meta in tree order, so
          // drop the static media-scoped fallbacks (they only matter without JS)
          // and keep the single tag that useTheme.ts also controls at runtime.
          for (const meta of document.querySelectorAll('meta[name="theme-color"][media]')) {
            meta.remove();
          }
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", color);
        };
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const storedColorTheme = window.localStorage.getItem("t3code:color-theme");
          const colorTheme =
            storedColorTheme !== null && storedColorTheme in THEME_BACKGROUNDS
              ? storedColorTheme
              : "default";
          if (colorTheme !== "default") {
            document.documentElement.dataset.colorTheme = colorTheme;
          }
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          applyChromeColor(THEME_BACKGROUNDS[colorTheme][isDark ? "dark" : "light"]);
        } catch {
          document.documentElement.classList.add("dark");
          applyChromeColor(THEME_BACKGROUNDS.default.dark);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        /* The boot script sets the theme-aware chrome color on <html>. */
        background: inherit;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
